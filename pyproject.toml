[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "svdynamics"
version = "0.0.1a2"
description = "Support Vector Dynamics: mixed (composite) kernels for scikit-learn SVMs."
readme = "readme_pypi.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE.MD"]
authors = [
  { name = "Leonid Shpaner", email = "lshpaner@ucla.edu" }
]
dependencies = [
  "numpy>=1.21",
  "scikit-learn>=1.0"
]

[project.urls]
Homepage = "https://github.com/lshpaner/svdynamics"
Documentation = "https://lshpaner.github.io/svdynamics/"
Issues = "https://github.com/lshpaner/svdynamics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/svdynamics"]

[tool.hatch.build.targets.sdist]
include = ["/src/svdynamics", "/readme_pypi.md", "/LICENSE.MD", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["unittests"]
addopts = "-q"